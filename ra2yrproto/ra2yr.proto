message TunnelPacket {
  uint32 source = 1;
  uint32 destination = 2;
  bytes data = 3;
}

message TargetClass {
  int32 m_id = 1;
  int32 m_rtti = 2;
}

message Event {
  message Animation {
    uint32 id = 1;
    uint32 house_id = 2;
  }

  message FrameInfo {
    uint32 crc = 1;
    uint32 command_count = 2;
    uint32 delay = 3;
  }

  message Deploy {
    TargetClass whom = 1;
  }

  message Target {
    TargetClass whom = 1;
  }

  message MegaMission {
    TargetClass whom = 1;
    Mission mission = 2;
    TargetClass target = 3;
    TargetClass destination = 4;
    TargetClass follow = 5;
    bool is_planning_event = 6;
  }

  message MegaMission_F {
    TargetClass whom = 1;
    Mission mission = 2;
    TargetClass target = 3;
    TargetClass destination = 4;
    int32 speed = 5;
    int32 max_speed = 6;
  }

  message Production {
    int32 rtti_id = 1;
    int32 heap_id = 2;
    int32 is_naval = 3;
  }

  message Unknown_LongLong {
    int32 unk_0 = 1;
    int64 data = 2;
    int32 unk_c = 3;
  }

  message Unknown_Tuple {
    int32 unk_0 = 1;
    int32 unk_4 = 2;
    int32 data = 3;
    int32 unk_c = 4;
  }

  message Place {
    AbstractType rtti_type = 1;
    int32 heap_id = 2;
    bool is_naval = 3;
    Coordinates location = 4;
  }

  message SpecialPlace {
    int32 id = 1;
    Coordinates location = 2;
  }

  message Specific {
    AbstractType rtti_type = 1;
    int32 id = 2;
  }

  message Sell {
    TargetClass whom = 1;
  }

  message SellCell {
    Coordinates cell = 1;
  }

  bool is_executed = 1;
  int32 house_index = 2;
  uint32 frame = 3;
  NetworkEvent event_type = 4;
  oneof data {
    Animation animation = 5;
    FrameInfo frame_info = 6;
    Target target = 7;
    MegaMission mega_mission = 8;
    MegaMission_F mega_mission_F = 9;
    Production production = 10;
    Unknown_LongLong unknown_long_long = 11;
    Unknown_Tuple unknown_tuple = 12;
    Place place = 13;
    SpecialPlace special_place = 14;
    Specific specific = 15;
    SellCell sell_cell = 16;
    Deploy deploy = 17;
    Sell sell = 18;
  }
  uint32 timing = 19;
}

message EventLists {
  repeated Event out_list = 1;
  repeated Event do_list = 2;
  repeated Event megamission_list = 3;
}

message EventListsSnapshot {
  repeated EventLists lists = 1;
  repeated uint64 frame = 2;
}

message ObjectTypes {
  repeated ObjectTypeClass object_types = 1;
}

