  double veteran_ratio = 1;
  double veteran_combat = 2;
  double veteran_speed = 3;
  double veteran_sight = 4;
  double veteran_armor = 5;
  double veteran_rof = 6;
  double refund_percent = 7;
  double reload_rate = 8;
  double repair_percent = 9;
  double repair_rate = 10;
  int32 repair_step = 11;
  double u_repair_rate = 12;
  double i_repair_rate = 13;
  int32 i_repair_step = 14;
  int32 self_heal_infantry_frames = 15;
  int32 self_heal_infantry_amount = 16;
  int32 self_heal_unit_frames = 17;
  int32 self_heal_unit_amount = 18;
  float multiple_factory = 19;
  float min_low_power_production_speed = 20;
  float max_low_power_production_speed = 21;
  int32 bridge_strength = 22;
  float occupy_damage_multiplier = 23;
  float occupy_rof_multiplier = 24;
  int32 occupy_weapon_range = 25;
  float bunker_damage_multiplier = 26;
  float bunker_rof_multiplier = 27;
  int32 bunker_weapon_range = 28;
  float open_topped_damage_multiplier = 29;
  int32 open_topped_range_bonus = 30;
  int32 open_topped_warp_distance = 31;
